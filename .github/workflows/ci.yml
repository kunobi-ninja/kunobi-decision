name: CI

on:
  # Every pull request, including ones stacked on another branch.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    name: Rust Checks
    runs-on: kunobi-runners
    container:
      image: rust:1.94-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      # Installs Rust from .mise.toml so local and CI toolchains share one
      # source of truth.
      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: rust@1.94.1

      - name: Install coverage tool
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-tarpaulin@0.35.4

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all targets)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Coverage
        run: cargo tarpaulin --engine llvm --all-features --workspace --out Json --output-dir coverage --fail-under 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/tarpaulin-report.json
          if-no-files-found: warn

      - name: Build (native-tls only)
        run: cargo build --no-default-features --features native-tls

      - name: Tests (no TLS backend)
        run: cargo test --no-default-features

      - name: Build docs
        run: cargo doc --lib --no-deps --all-features

      # Builds the crate from exactly the files that would be published, so a
      # missing entry in `include` fails here instead of on crates.io.
      - name: Verify package
        run: cargo package --locked

  deny:
    name: cargo-deny
    runs-on: kunobi-runners
    container:
      image: rust:1.94-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: cargo-deny-${{ runner.os }}-

      - name: Install cargo-deny
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: aqua:EmbarkStudios/cargo-deny@0.19.4

      - name: cargo deny check
        run: cargo deny check

  e2e:
    name: E2E (TypeSafe API)
    runs-on: kunobi-runners
    container:
      image: rust:1.94-bookworm
    timeout-minutes: 15
    needs: checks
    # Optional until a TYPESAFE_API_KEY repository secret exists. Without it
    # (including fork and Dependabot PRs, which get no secrets) every step is
    # skipped and the job passes.
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Report skipped live tests
        if: env.TYPESAFE_API_KEY == ''
        run: echo "::notice::TYPESAFE_API_KEY is not set; skipping live API tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TYPESAFE_API_KEY != ''

      - name: Cache cargo
        if: env.TYPESAFE_API_KEY != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-e2e-${{ runner.os }}-

      - name: Install mise tools
        if: env.TYPESAFE_API_KEY != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: rust@1.94.1

      - name: Run live API tests
        if: env.TYPESAFE_API_KEY != ''
        run: cargo test --test e2e_api -- --ignored --nocapture
