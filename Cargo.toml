[package]
name = "kunobi-decision"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Typed decision clients for Jev, Cloudflare Clef, Liquid d1, Vercel and OpenRouter"
repository = "https://github.com/kunobi-ninja/kunobi-decision"
readme = "README.md"
keywords = ["typesafe", "jev", "classification", "ai", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
# Publish only what builds the library. Tests, CI and tooling stay in the repository.
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[features]
default = ["rustls"]
# TLS backend for the default HTTP client. Pick one; with neither, pass a client
# through `ClientBuilder::http_client` or https requests will fail.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# `testing::FakeSystemOne`, a scripted `SystemOne` for tests in code that uses this crate.
testing = []
# `blocking::Client`, for callers with no async runtime. Brings in a Tokio
# runtime the client drives itself.
blocking = ["tokio/rt"]

[dependencies]
# HTTP. The TLS backend comes from this crate's `rustls` / `native-tls` features;
# callers can also pass their own `reqwest::Client` through `ClientBuilder::http_client`.
reqwest = { version = "0.13", default-features = false }
bytes = "1"

# Async. Only timers are needed: reqwest brings the I/O driver.
tokio = { version = "1", features = ["sync", "time"] }

# Serialization. `indexmap` and `preserve_order` keep question, label and
# state key order as the caller wrote it, which is the order the model sees.
# Without `preserve_order`, any object passing through `serde_json::Value`
# (state built with `json!`, answers read back) comes out sorted by key.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

# Retry-After HTTP dates and backoff jitter.
httpdate = "1"
fastrand = "2"

# Credentials: keys and formatted headers are wiped from memory on drop.
secrecy = "0.10"
zeroize = "1"

# Errors
thiserror = "2"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
wiremock = "0.6"
# Property-based testing for parsers + boundaries.
proptest = "1.5"
anyhow = "1"

[workspace]
members = ["compat/kunobi-jev"]
